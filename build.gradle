plugins {
    id 'fabric-loom' version '1.0-SNAPSHOT'
    id 'maven-publish'
}

repositories {
    mavenCentral()
    maven {
        name = 'Fabric'
        url = 'https://maven.fabricmc.net/'
    }
}

extensions {
    loom {
        minecraftVersion = '1.20.4'
        mappingsVersion = '1.20.4+build.1'
        run {
            version = 'client'
            property 'fabric-api:client', 'true'
            property 'fabric-api:environment', 'client'
        }
    }
}

dependencies {
    minecraft 'com.mojang:minecraft:1.20.4'
    mappings 'net.fabricmc:yarn:1.20.4+build.1:v2'
    modImplementation 'net.fabricmc.fabric-api:fabric-api:0.83.0+1.20.4'
}

processResources {
    inputs.property 'version', project.version
    inputs.property 'minecraft_version', loom.minecraftVersion
}

jar {
    from {
        configurations.compileClasspath.collect {
            it.isDirectory() ? it : zipTree(it)
        }
    }
}
